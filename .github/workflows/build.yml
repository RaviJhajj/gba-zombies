name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile ROM using Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/source -w /source devkitpro/devkitarm:latest make

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: "*.gba"
