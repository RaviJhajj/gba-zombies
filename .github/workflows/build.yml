name: Build GBA ROM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile ROM
        run: |
          make

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-rom
          path: "*.gba"
